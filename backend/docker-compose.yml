services:
  backend:
    build: .
    ports:
      - "5000:5000"
    volumes:
      - ./data:/app/data  # SQLite state (Config.STATE_DB_PATH) + pcap captures (Config.CAPTURES_DIR)
    env_file:
      - .env
    # Real enforcement (POST /api/enforce/apply with ENFORCEMENT_ENABLED=true)
    # needs to see and modify a real host interface, which a container's
    # default bridge network can't do. Uncomment both lines below and set
    # ENFORCEMENT_INTERFACE to a real host interface name to enable it --
    # left off by default since it's a real capability grant, not
    # something a docker-compose file should hand out silently.
    # network_mode: host
    # cap_add:
    #   - NET_ADMIN
